name: Weekly Canon Audit

on:
  schedule:
    # Every Monday at 03:33 UTC (Sunday 7:33 PM PST)
    - cron: '33 3 * * 1'
  workflow_dispatch:

concurrency:
  group: weekly-canon-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare audit output directory
        run: mkdir -p vault/weekly

      - name: Validate Canon structure
        run: |
          test -f canon/INDEX.md
          test -f canon/scripts/audit.sh
          test -d canon/charters
          test -d canon/contracts

      - name: Run declared-state audit
        run: |
          bash canon/scripts/audit.sh "https://github.com/${GITHUB_REPOSITORY}.git"

      - name: Capture Canon status
        run: |
          DATE="$(date -u +%Y-%m-%d)"
          STATUS="vault/weekly/status-${DATE}.txt"
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "base_commit=$(git rev-parse HEAD)"
            echo "counts_scope=generated_audit_tree_pending_review"
            echo "canon_files=$(find canon -type f | wc -l | tr -d ' ')"
            echo "charters=$(find canon/charters -maxdepth 1 -type f | wc -l | tr -d ' ')"
            echo "contracts=$(find canon/contracts -type f | wc -l | tr -d ' ')"
            echo "dossiers=$(find canon/dossiers -type f | wc -l | tr -d ' ')"
            echo "weekly_changed_files=$(git log --since='7 days ago' --name-only --pretty='' | sort -u | sed '/^$/d' | wc -l | tr -d ' ')"
          } > "$STATUS"
          cat "$STATUS"

      - name: Generate audit snapshot
        run: |
          DATE="$(date -u +%Y-%m-%d)"
          STATUS="vault/weekly/status-${DATE}.txt"
          LATEST_DOSSIER="$(find canon/dossiers -type f -name 'audit-*' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          cat > "vault/weekly/audit-${DATE}.md" <<EOF
          # Weekly Canon Audit Snapshot

          **Date:** ${DATE}  
          **Time:** $(date -u +%H:%M:%S) UTC  
          **Trigger:** ${GITHUB_EVENT_NAME}  
          **Base commit:** $(git rev-parse HEAD)  
          **Counts scope:** generated audit tree pending review

          ## Canon Status
          \`\`\`
          $(cat "$STATUS")
          \`\`\`

          ## Declared-State Audit
          Latest dossier: ${LATEST_DOSSIER}

          ## Changes Since Last Week
          $(git log --oneline --since='7 days ago' || true)
          EOF

      - name: Publish audit review pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE="$(date -u +%Y-%m-%d)"
          BRANCH="automation/weekly-canon-audit-${DATE}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "MIRRORNODE Canon Bot"
          git config user.email "canon@mirrornode.local"
          git add vault/weekly/ canon/dossiers/
          if git diff --staged --quiet; then
            echo "No audit changes to publish."
            exit 0
          fi

          git switch -c "$BRANCH"
          git commit -m "Weekly audit: ${DATE}"
          git push --set-upstream origin "$BRANCH"

          PR_BODY="$(cat <<EOF
          Automated weekly Canon audit evidence for ${DATE}.

          - Source run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Review branch: ${BRANCH}
          - Publication path: protected pull request into main

          This pull request requires the repository's normal review and status checks before merge.
          EOF
          )"

          if ! PR_URL="$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Weekly Canon Audit: ${DATE}" \
            --body "$PR_BODY")"; then
            echo "::error::The audit branch was published, but GitHub Actions could not create its pull request. Enable repository workflow permission to create pull requests, then open a PR from ${BRANCH}."
            exit 1
          fi

          echo "Created audit pull request: ${PR_URL}"
          gh workflow run core-ci.yml --ref "$BRANCH"
          gh workflow run canon-gate.yml --ref "$BRANCH"

      - name: Report drift signal
        run: |
          CHANGES="$(git log --since='7 days ago' --name-only --pretty='' | sort -u | sed '/^$/d' | wc -l | tr -d ' ')"
          echo "Files changed in the last 7 days: ${CHANGES}"
          if [ "${CHANGES}" -gt 25 ]; then
            echo "::warning::Elevated weekly repository change volume: ${CHANGES} files"
          fi
